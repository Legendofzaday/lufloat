name: Format Rust

on:
  push:

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: format Rust code"
